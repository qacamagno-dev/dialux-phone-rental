<ion-header>

  <ion-toolbar>

    <ion-buttons slot="start">

      <ion-back-button
        defaultHref="/tabs/profile">
      </ion-back-button>

    </ion-buttons>

    <ion-title>
      My Orders
    </ion-title>

  </ion-toolbar>

</ion-header>

<ion-content>

  <div
    class="state"
    *ngIf="!auth.isLoggedIn()">

    <ion-icon
      name="receipt-outline">
    </ion-icon>

    <h2>
      Sign in to see your rentals
    </h2>

    <p>
      Your booking history and
      active rentals will appear here.
    </p>

    <ion-button
      (click)="login()">
      Sign in
    </ion-button>

  </div>

  <div
    class="state"
    *ngIf="
      auth.isLoggedIn() &&
      loading()
    ">

    <ion-spinner
      name="crescent">
    </ion-spinner>

    <p>
      Loading orders...
    </p>

  </div>

  <div
    class="state"
    *ngIf="
      auth.isLoggedIn() &&
      !loading() &&
      error()
    ">

    <ion-icon
      name="alert-circle-outline">
    </ion-icon>

    <h2>
      Couldn't load orders
    </h2>

    <p>
      {{ error() }}
    </p>

    <ion-button
      (click)="load()">
      Try Again
    </ion-button>

  </div>

  <div
    class="state"
    *ngIf="
      auth.isLoggedIn() &&
      !loading() &&
      !error() &&
      orders().length === 0
    ">

    <ion-icon
      name="receipt-outline">
    </ion-icon>

    <h2>
      No orders yet
    </h2>

    <p>
      Your rentals will appear here
      after checkout.
    </p>

    <ion-button
      (click)="browseDevices()">
      Browse Devices
    </ion-button>

  </div>

  <main
    class="orders-page"
    *ngIf="
      auth.isLoggedIn() &&
      !loading() &&
      !error() &&
      orders().length > 0
    ">

    <button
      type="button"
      class="order-card"
      *ngFor="
        let order of orders()
      "
      (click)="open(order)">

      <div class="order-top">

        <div>

          <span class="label">
            Order
          </span>

          <strong class="invoice">
            {{ order.invoiceNo }}
          </strong>

        </div>

        <span
          class="status"
          [ngClass]="
            statusClass(
              order.status
            )
          ">

          {{
            statusLabel(
              order.status
            )
          }}

        </span>

      </div>

      <div class="order-device">

        <div class="device-image">

          <img
            *ngIf="
              order.items?.[0]?.image
            "
            [src]="
              apiUrl(
                order.items[0].image
              )
            "
            [alt]="
              order.items[0]?.name ||
              'Rental device'
            ">

          <ion-icon
            *ngIf="
              !order.items?.[0]?.image
            "
            name="phone-portrait-outline">
          </ion-icon>

        </div>

        <div class="device-copy">

          <h3>
            {{
              itemSummary(
                order
              )
            }}
          </h3>

          <p>
            {{
              order.items?.length || 0
            }}
            {{
              (order.items?.length || 0) === 1
                ? 'device'
                : 'devices'
            }}
          </p>

        </div>

      </div>

      <div class="meta-row">

        <ion-icon
          name="calendar-outline">
        </ion-icon>

        <span>
          {{ order.startDate }}
          to
          {{ order.endDate }}
        </span>

      </div>

      <div class="meta-row">

        <ion-icon
          name="location-outline">
        </ion-icon>

        <span>
          {{
            order.orderType
              | titlecase
          }}
        </span>

      </div>

      <div class="order-bottom">

        <div>

          <span class="label">
            Payment
          </span>

          <strong>
            {{
              paymentLabel(
                order.payment?.method
              )
            }}
          </strong>

        </div>

        <div class="total">

          <span class="label">
            Total
          </span>

          <strong>
            {{ money(order.total) }}
          </strong>

        </div>

      </div>

      <div class="view-row">

        <span>
          View order details
        </span>

        <ion-icon
          name="chevron-forward-outline">
        </ion-icon>

      </div>

    </button>

  </main>

</ion-content>
